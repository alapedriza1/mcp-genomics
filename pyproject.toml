[project]
name = "mcp-genomics"
version = "0.1.0"
description = "An MCP server for genomics intelligence, build for biotech & pharma enterprise workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-genomics = "mcp_genomics.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_genomics"]
